services:
  shop_api:
    build:
      context: .
    container_name: shop_api
    env_file:
      - .env
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "7001:8000"
    depends_on:
      shop_api_db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SECRET: ${SECRET}
      DEBUG: ${DEBUG}
      DB_ENGINE: ${DB_ENGINE}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      REDIS_HOST: ${REDIS_HOST}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}

  shop_api_db:
    image: "postgres:14"
    container_name: shop_api_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - shop_api-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: "redis:7-alpine"
    container_name: shop_api_redis
    ports:
      - "6380:6379"

  celery:
    build:
      context: .
    container_name: shop_api_celery
    env_file:
      - .env
    command: celery -A shop_api worker -l info
    depends_on:
      - shop_api_db
      - redis

  celery-beat:
    build:
      context: .
    container_name: shop_api_celery_beat
    env_file:
      - .env
    command: celery -A shop_api beat -l info
    depends_on:
      - shop_api_db
      - redis

volumes:
  shop_api-data: